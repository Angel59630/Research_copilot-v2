[project]
name = "research-copilot"
version = "0.1.0"
description = "Local single-user agentic research assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "alembic>=1.16",
    "python-multipart>=0.0.20",
    "pymupdf>=1.26",
    "chromadb>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.6",
    "httpx>=0.28",
    "mcp>=1.12",
]

[tool.uv]
package = false
